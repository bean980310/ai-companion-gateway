[project]
name = "ai-companion-gateway"
version = "0.3.0"
description = "Provider-agnostic LLM gateway (client wrappers, provider registry, tool calling) for AI Companion"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Hyunbeen Chang", email = "bean980310@gmail.com" }
]
maintainers = [
    { name = "Hyunbeen Chang", email = "bean980310@gmail.com" }
]
dependencies = [
    "ai-companion-core",
    "typing_extensions",
    "pillow",
    "pydantic",
    "openai>=1.102.2",
    "anthropic>=0.64.0",
    "google-genai>=1.32.0",
    "mistralai",
    "xai-sdk",
    "ollama",
    "lmstudio",
    "huggingface-hub",
    "mem0ai",
]

[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8",
    "wheel",
    "build",
    "uv-build",
]

[tool.setuptools.packages.find]
where = ["src"]
